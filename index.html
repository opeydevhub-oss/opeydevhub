e and landing pages. My work is front-end focused with React and modern web tooling, and I use services like Supabase when a project needs a real backend behind the interface.",availability:"Available for freelance projects",primaryAction:{label:"View My Projects",href:"/projects"},secondaryAction:{label:"Contact Me",href:"/contact"}},Be={id:"about",kicker:"About",heading:"About OPEY DEV HUB",subheading:"I'm a frontend developer focused on building responsive, functional, and user-friendly websites.",preview:"I'm a web developer focused on the front end: React, HTML, CSS and JavaScript. I build responsive websites that load quickly, look right on every screen, and are easy for your customers to actually use. Right now I'm developing my backend skills with services like Supabase, so I can take on projects that need more than a static front end.",paragraphs:["I became interested in Computer Science before starting university, but my academic path led me into Agricultural Economics. Instead of dropping my interest in technology, I decided to teach myself how to code and started building websites and web applications.","Over time, I moved from learning through tutorials and practice projects to building real products and working with clients. I have built several projects along the way to improve my skills and gain practical experience.","TASKOWO is one of my major projects. E.M.B SPARKLY was my first client project. I use modern frontend technologies like React, and I have also worked with Supabase as a backend service.","I am currently a 200-level Agricultural Economics student. I keep building and learning as a developer in my spare time, and I am continuously improving my skills with every project."],focusHeading:"How I work",focuses:["Responsive design","Clean interfaces","Useful functionality","Accessibility","Maintainable code","Continuous improvement through real projects"],brandStatement:"CODE • CREATE • ELEVATE"},$n={id:"skills",kicker:"Capabilities",heading:"Skills",subheading:"The frontend technologies and tools I actually work with to build responsive, functional websites and web applications.",note:"I am continuously improving my frontend development skills: learning new tools and best practices as I keep building.",groups:[{title:"Frontend",items:["HTML5","CSS3","JavaScript","React","Responsive Web Design"]},{title:"Tools & Workflow",items:["Git","GitHub","VS Code"]},{title:"Backend / Services I Have Worked With",items:["Supabase"]}]},St={id:"projects",kicker:"SELECTED WORK",heading:"Projects I've Built",subheading:"A collection of websites and web applications I've built while developing my skills and working with real projects.",items:[{title:"TASKOWO",slug:"taskowo",category:"Web Application",description:"A practical web platform built around task-based opportunities, user interaction, and a simple digital experience.",note:"",stack:["HTML","CSS","JavaScript","Supabase"],image:"",size:"feature",links:{live:"https://taskowo.netlify.app/"}},{title:"E.M.B SPARKLY",slug:"emb-sparkly",category:"E-commerce Website",description:"A responsive e-commerce website built for a fashion brand, featuring product browsing, product details, shopping cart functionality, and a Supabase-powered backend.",note:"First client project",stack:["HTML","CSS","JavaScript","Supabase"],image:"",size:"tall",links:{live:"https://embsparkly.com/"}},{title:"OLA OLUWA BLOCK INDUSTRY",slug:"ola-oluwa-block-industry",category:"Business Website",description:"A responsive business website created to showcase products, provide business information, and make it easy for customers to get in touch.",note:"",stack:["HTML","CSS","JavaScript"],image:"",size:"wide",links:{live:"https://ola-oluwa-blockindustry.netlify.app/"}},{title:"The Scholars' Model College",slug:"the-scholars-model-college",category:"School Website",description:"A school website built for The Scholars' Model College to present its levels, admissions information, gallery, and contact detai
